<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090514" />
    </radialGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />

  <!-- Outer Glow Shield -->
  <path d="M256 70 L390 130 C390 280 320 380 256 440 C192 380 122 280 122 130 Z" 
        fill="none" stroke="url(#shieldGrad)" stroke-width="4" filter="url(#neonGlow)" opacity="0.4" />

  <!-- Main Shield -->
  <path d="M256 80 L380 135 C380 270 315 365 256 425 C197 365 132 270 132 135 Z" 
        fill="url(#bgGrad)" stroke="url(#shieldGrad)" stroke-width="8" filter="url(#neonGlow)" />

  <!-- Scan Lines in Background of Shield -->
  <path d="M160 170 H352 M160 210 H352 M160 250 H352 M160 290 H352 M160 330 H352" 
        stroke="#6366f1" stroke-width="1" opacity="0.15" />

  <!-- Stylized QR Code / Security Grid Graphic in Center -->
  <g transform="translate(186, 186)" stroke="url(#shieldGrad)" stroke-width="4" fill="none">
    <!-- QR Corner 1 -->
    <rect x="0" y="0" width="36" height="36" rx="6" stroke-width="6" />
    <rect x="10" y="10" width="16" height="16" rx="2" fill="url(#shieldGrad)" />
    
    <!-- QR Corner 2 -->
    <rect x="104" y="0" width="36" height="36" rx="6" stroke-width="6" />
    <rect x="114" y="10" width="16" height="16" rx="2" fill="url(#shieldGrad)" />

    <!-- QR Corner 3 -->
    <rect x="0" y="104" width="36" height="36" rx="6" stroke-width="6" />
    <rect x="10" y="114" width="16" height="16" rx="2" fill="url(#shieldGrad)" />

    <!-- Small Pixel clusters -->
    <rect x="56" y="12" width="12" height="12" fill="#06b6d4" stroke="none" />
    <rect x="76" y="24" width="12" height="12" fill="#a855f7" stroke="none" />
    
    <rect x="12" y="56" width="12" height="12" fill="#a855f7" stroke="none" />
    <rect x="24" y="76" width="12" height="12" fill="#06b6d4" stroke="none" />

    <rect x="56" y="56" width="28" height="28" rx="4" fill="url(#shieldGrad)" stroke="none" />
    
    <rect x="104" y="56" width="12" height="20" fill="#6366f1" stroke="none" />
    <rect x="120" y="88" width="20" height="12" fill="#06b6d4" stroke="none" />
    
    <rect x="56" y="104" width="20" height="12" fill="#06b6d4" stroke="none" />
    <rect x="88" y="120" width="12" height="20" fill="#a855f7" stroke="none" />
  </g>

  <!-- Glowing Scanner Line Effect -->
  <line x1="140" y1="256" x2="372" y2="256" stroke="#22d3ee" stroke-width="4" filter="url(#neonGlow)">
    <animate attributeName="y1" values="160;330;160" dur="4s" repeatCount="indefinite" />
    <animate attributeName="y2" values="160;330;160" dur="4s" repeatCount="indefinite" />
  </line>
</svg>
